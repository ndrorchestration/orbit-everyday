1,36,.06);border:1px solid rgba(251,191,36,.25);color:#ffe9b3}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}canvas{width:100%;height:340px;display:block;border-radius:8px;background:#08090e;touch-action:none}.controls{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:12px}.ctrl{display:flex;flex-direction:column;gap:6px;min-width:180px}.ctrl label{color:var(--text-dim);font-family:var(--mono);font-size:11px}input[type=range]{accent-color:var(--cyan);width:100%;cursor:pointer}input[type=range]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}input[type=text]{background:#08090e;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:12px;width:100%}input[type=text]:focus-visible{outline:2px solid var(--cyan);outline-offset:-1px}button{background:var(--cyan);color:#06070b;border:none;border-radius:6px;padding:8px 14px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.stat{background:#08090e;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);min-width:120px}.stat .k{font-size:10px;color:var(--text-dim);margin-bottom:4px}.stat .v{font-size:15px;color:var(--cyan)}.formula{font-family:var(--mono);font-size:12px;color:var(--violet);background:#08090e;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}.note{font-size:11px;color:var(--text-dim);margin-top:10px;line-height:1.6}.legend{display:flex;gap:14px;font-size:11px;color:var(--text-dim);margin-top:8px;font-family:var(--mono)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}pre{background:#08090e;border:1px solid var(--line);border-radius:8px;padding:12px;font-fami <script>
function fnv1a(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(seed){let state=seed>>>0;return function(){state=(state+1831565813)>>>0;let n=state;n=Math.imul(n^(n>>>15),n|1);n^=n+Math.imul(n^(n>>>7),n|61);return((n^(n>>>14))>>>0)/4294967296}}function randUnitVector(seedStr,n=8){const rng=mulberry32(fnv1a(seedStr)),v=Array.from({length:n},()=>rng()*2-1),norm=Math.sqrt(v.reduce((s,x)=>s+x*x,0))||1;return v.map(x=>x/norm)}function gram(vectors){const n=vectors.length,G=Array.from({length:n},()=>Array(n).fill(0));for(let i=0;i<n;i++)for(let j=0;j<n;j++){let s=0;for(let k=0;k<vectors[0].length;k++)s+=vectors[i][k]*vectors[j][k];G[i][j]=s}return G}function powerIterTopEig(M,iters=200,seedStr='eig'){const n=M.length,rng=mulberry32(fnv1a(seedStr));let r=Array.from({length:n},()=>rng()),norm=Math.sqrt(r.reduce((s,x)=>s+x*x,0))||1;r=r.map(x=>x/norm);let prevVal=0;for(let it=0;it<iters;it++){const a=M.map(row=>row.reduce((s,v,k)=>s+v*r[k],0)),an=Math.sqrt(a.reduce((s,x)=>s+x*x,0))||1;r=a.map(x=>x/an);const Mr=M.map(row=>row.reduce((s,v,k)=>s+v*r[k],0)),val=r.reduce((s,x,i)=>s+x*Mr[i],0);if(Math.abs(val-prevVal)<1e-12)break;prevVal=val}const Mr=M.map(row=>row.reduce((s,v,k)=>s+v*r[k],0)),val=r.reduce((s,x,i)=>s+x*Mr[i],0);return{val:Math.max(0,val),vec:r}}function topKEigDeflation(M,k=4,seedPrefix='eig'){let A=M.map(row=>[...row]),eigs=[];for(let i=0;i<Math.min(k,M.length);i++){const{val,vec}=powerIterTopEig(A,200,seedPrefix+i);if(val<1e-8){eigs.push(0);continue}eigs.push(val);for(let a=0;a<A.length;a++)for(let b=0;b<A.length;b++)A[a][b]-=val*vec[a]*vec[b]}return eigs}function effectiveRank(eigs){const maxEig=Math.max(...eigs,1),normalized=eigs.map(e=>Math.sqrt(Math.max(0,e/maxEig))),sum=normalized.reduce((a,b)=>a+b,0),sumSq=normalized.reduce((a,b)=>a+b*b,0),eff=sumSq===0?0:sum*sum/sumSq,sigmas=eigs.map(e=>Math.sqrt(Math.max(0,e)));return{eff,sigmas,sum:sigmas.reduce((a,b)=>a+b,0),sumSq:sigmas.reduce((a,b)=>a+b*b,0)}}function shannonEntropy(probs){return-probs.reduce((s,p)=>(p>1e-9?s+p*Math.log(p):s),0)}function cosineSim(a,b){let dot=0,na=0,nb=0;for(let i=0;i<a.length;i++){dot+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i]}return dot/(Math.sqrt(na)*Math.sqrt(nb)+1e-9)}function euclid2D(p,q){return Math.hypot(p.x-q.x,p.y-q.y)}function knnGraph(points,k){return points.map((p,i)=>points.map((q,j)=>({j,d:i===j?Infinity:euclid2D(p,q)})).sort((a,b)=>a.d-b.d).slice(0,k))}function knnDensityAt(query,dataPoints,k){if(dataPoints.length===0)return{rho:0,Rk:Infinity};k=Math.min(k,dataPoints.length);const dists=dataPoints.map(p=>euclid2D(query,p)).sort((a,b)=>a-b),Rk=dists[k-1]||1e-6,N=dataPoints.length;return{rho:k/(N*Math.PI*Rk*Rk),Rk}}function percentile(arr,p){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b),idx=Math.min(s.length-1,Math.max(0,Math.floor(p/100*(s.length-1))));return s[idx]}function computeVoidGrid(points,{cols=6,rows=4,k=15}={}){if(!points.length)return{cells:[],threshold:0,voids:[]};const cells=[];for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){const x=(c+.5)/cols,y=(r+.5)/rows,{rho,Rk}=knnDensityAt({x,y},points,Math.min(k,points.length));cells.push({x,y,rho,Rk,col:c,row:r})}const threshold=percentile(cells.map(c=>c.rho),5);return{cells,threshold,voids:cells.filter(c=>c.rho<=threshold)}}function autocorrelation(series,maxLag){const n=series.length;if(!n)return[];const mean=series.reduce((a,b)=>a+b,0)/n,variance=series.reduce((s,x)=>s+(x-mean)*(x-mean),0)/n;if(variance<1e-12)return Array(maxLag).fill(1);const acf=[];for(let lag=0;lag<maxLag;lag++){let s=0;for(let t=0;t<n-lag;t++)s+=(series[t]-mean)*(series[t+lag]-mean);acf.push(s/(n*variance))}return acf}function firstZeroCrossing(acf,fallback=18){for(let i=1;i<acf.length;i++)if(acf[i-1]>0&&acf[i]<=0)return i;return fallback}function takensEmbed(series,tau,m){const N=series.length-(m-1)*tau;if(N<1)return[];const vectors=[];for(let i=0;i<N;i++){const v=[];for(let j=0;j<m;j++)v.push(series[i+j*tau]);vectors.push(v)}return vectors}function vecDist(a,b){let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-b[i])**2;return Math.sqrt(s)}function rosensteinLyapunov(series,tau,m,maxT=10,minTsep=null){const vectors=takensEmbed(series,tau,m),N=vectors.length;if(N<5)return{lambda:null,curve:[],note:'series too short'};const sep=minTsep==null?tau:minTsep,nn=new Array(N).fill(-1);for(let i=0;i<N;i++){let best=-1,bestD=Infinity;for(let j=0;j<N;j++){if(Math.abs(j-i)<=sep)continue;const d=vecDist(vectors[i],vectors[j]);if(d<bestD){bestD=d;best=j}}nn[i]=best}const curve=[];for(let delta=0;delta<maxT;delta++){const vals=[];for(let i=0;i<N-delta;i++){const j=nn[i];if(j<0||j+delta>=N)continue;const d=vecDist(vectors[i+delta],vectors[j+delta]);if(d>1e-12)vals.push(Math.log(d))}curve.push(vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null)}const pts=curve.map((y,x)=>({x,y})).filter(p=>p.y!==null&&isFinite(p.y));if(pts.length<2)return{lambda:null,curve,N,tau,m};const n=pts.length,sx=pts.reduce((s,p)=>s+p.x,0),sy=pts.reduce((s,p)=>s+p.y,0),sxx=pts.reduce((s,p)=>s+p.x*p.x,0),sxy=pts.reduce((s,p)=>s+p.x*p.y,0),denom=n*sxx-sx*sx,lambda=denom?(n*sxy-sx*sy)/denom:null;return{lambda,curve,N,tau,m}}function jacobiEigenvalues(M,maxSweeps=100){let A=M.map(r=>[...r]);const n=A.length;for(let sweep=0;sweep<maxSweeps;sweep++){let off=0;for(let p=0;p<n;p++)for(let q=p+1;q<n;q++)off+=A[p][q]*A[p][q];if(off<1e-20)break;for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){if(Math.abs(A[p][q])<1e-15)continue;const theta=(A[q][q]-A[p][p])/(2*A[p][q]),t=Math.sign(theta||1)/(Math.abs(theta)+Math.sqrt(theta*theta+1)),c=1/Math.sqrt(t*t+1),s=t*c,App=A[p][p],Aqq=A[q][q],Apq=A[p][q];A[p][p]=c*c*App-2*s*c*Apq+s*s*Aqq;A[q][q]=s*s*App+2*s*c*Apq+c*c*Aqq;A[p][q]=A[q][p]=0;for(let i=0;i<n;i++){if(i===p||i===q)continue;const Aip=A[i][p],Aiq=A[i][q];A[i][p]=A[p][i]=c*Aip-s*Aiq;A[i][q]=A[q][i]=s*Aip+c*Aiq}}}return A.map((r,i)=>r[i]).sort((a,b)=>b-a)}
const TABS=[{id:0,title:'Welcome',provenance:null},{id:1,title:'Attractor Field',provenance:'verified',note:"k-means (Lloyd's algorithm) AND a real kNN graph, both computed on the actual point set."},{id:2,title:'Effective Rank',provenance:'verified',note:'Gram matrix eigendecomposition via power iteration + deflation, cross-checked against Jacobi solve on-page.'},{id:3,title:'Debt Ledger',provenance:'honest',note:'Cosine similarity mechanism is real. The vectors it compares are deterministic hash fallbacks, not semantic embeddings.'},{id:4,title:'Void Map',provenance:'verified',note:'Real kNN density estimate at each grid cell, thresholded at the actual 5th percentile.'},{id:5,title:'Lens Entropy',provenance:'verified',note:'Shannon entropy over normalized singular values of a real Gram matrix.'},{id:6,title:'Lyapunov & Takens',provenance:'verified',note:'Real Rosenstein (1993) algorithm with Takens embedding.'},{id:7,title:'Capture',provenance:'honest',note:'No transformer model ships in this file. The fallback hash embedding is labeled for what it is.'},{id:8,title:'Export',provenance:'verified',note:'Export includes per-field provenance map instead of blanket realFlag.'}];
let state={tab:0,points:createInitialPoints(),centers:[{x:.32,y:.36},{x:.72,y:.4},{x:.51,y:.74}],lensWeights:[.9,.4,.6,.2],tauUser:12,captureText:'What if calm is a feature, not lack of features?',debts:createInitialDebts(),debtInput:'',debtSelected:'d1'};function createInitialPoints(){const pts=[],centers=[[.3,.35],[.7,.38],[.5,.75]];let id=0;centers.forEach((c,ci)=>{const rng=mulberry32(fnv1a(ci+'x'));for(let o=0;o<20;o++)pts.push({x:Math.min(.95,Math.max(.05,c[0]+(rng()-.5)*.22)),y:Math.min(.95,Math.max(.05,c[1]+(rng()-.5)*.22)),id:id++,cluster:ci,vec:randUnitVector(`${ci}-${o}`,8)})});return pts}function createInitialDebts(){return[{id:'d1',text:'Am I building something people actually need?',interest:.3,revisits:3,resolved:false},{id:'d2',text:'Why does focus feel harder this month?',interest:.6,revisits:6,resolved:false},{id:'d3',text:'Should we change pricing model?',interest:.2,revisits:2,resolved:false}]}const pc1Series=Array.from({length:2000},(e,i)=>{const rng=mulberry32(fnv1a('pc1'+i));return Math.sin(i*.12)*.6+Math.sin(i*.04)*.4+(rng()-.5)*.15});function kmeans(points,k,initCenters,iters=10){if(!points.length)return{centers:[],assign:[]};let centers=initCenters?initCenters.map(c=>({x:c.x,y:c.y})):points.slice(0,k).map(p=>({x:p.x,y:p.y})),assign=new Array(points.length).fill(0);for(let it=0;it<iters;it++){assign=points.map(p=>{let best=0,bd=Infinity;centers.forEach((c,ci)=>{const d=(p.x-c.x)**2+(p.y-c.y)**2;if(d<bd){bd=d;best=ci}});return best});centers=centers.map((c,ci)=>{const members=points.filter((p,pi)=>assign[pi]===ci);if(!members.length)return c;return{x:members.reduce((s,p)=>s+p.x,0)/members.length,y:members.reduce((s,p)=>s+p.y,0)/members.length}})}return{centers,assign}}function debounce(fn,delay){let timer;return function(...args){clearTimeout(timer);timer=setTimeout(()=>fn.apply(this,args),delay)}}function showToast(message,type='success',duration=3000){const toast=document.getElementById('toast');toast.textContent=message;toast.className=`toast show ${type}`;setTimeout(()=>toast.className='toast',duration)}function setupCanvas(id){const canvas=document.getElementById(id);if(!canvas)return null;const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect(),W=rect.width||800,H=rect.height||340;canvas.width=W*dpr;canvas.height=H*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);return{canvas,ctx,W,H}}function htmlNode(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild||document.createElement('div')}
function render(){renderNav();renderMain()}function renderNav(){const nav=document.getElementById('nav');nav.innerHTML='<div class="brand"><b>ORBIT</b> · verified build v4</div><div class="subtitle">Every tab is tagged with what is actually computed. Green = verified computation. Amber = honestly-labeled fallback.</div>';TABS.forEach(t=>{const div=document.createElement('div');div.className='tab'+(state.tab===t.id?' active':'');div.setAttribute('role','button');div.setAttribute('tabindex','0');div.setAttribute('aria-label',`${t.title} tab`);div.innerHTML=`<span class="n">${String(t.id).padStart(2,'0')}</span><span>${t.title}</span>`+(t.provenance?`<span class="badge ${t.provenance}">${t.provenance==='verified'?'VERIFIED':'HONEST'}</span>`:'');const activate=()=>{state.tab=t.id;render()};div.onclick=activate;div.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}};nav.appendChild(div)})}function provenanceBox(tab){return tab.provenance?`<div class="provenance ${tab.provenance}">${tab.provenance==='verified'?'✓ VERIFIED':'⚠ HONEST FALLBACK'} — ${tab.note}</div>`:''}function renderMain(){const main=document.getElementById('main'),tab=TABS[state.tab];main.innerHTML=`<h1>${tab.title}</h1>${provenanceBox(tab)}`;const fns={0:renderWelcome,1:renderAttractor,2:renderEffRank,3:renderDebt,4:renderVoid,5:renderLensEntropy,6:renderLyapunov,7:renderCapture,8:renderExport};fns[tab.id](main)}function renderWelcome(main){main.insertAdjacentHTML('beforeend',`<p class="desc">A provenance-tagged rebuild of the original ORBIT tutorial artifact. The interface distinguishes verified computation from honest fallbacks.</p><div class="panel"><div class="formula">Fact-Fiction Ledger: 7 of 8 substantive tabs VERIFIED. 2 mechanism/substrate paths are explicitly HONEST FALLBACKS.</div><div class="note">Includes debounced interaction, DPI-aware canvas rendering, keyboard-accessible navigation, dual eigenvalue verification, explicit provenance, responsive layout, and expo
